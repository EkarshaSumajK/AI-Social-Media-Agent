services:
  postgres:
    image: postgres:16
    env_file:
      - .env.db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.backend
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.backend
    depends_on:
      - backend
      - redis
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.backend
    depends_on:
      - backend
      - redis
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env.frontend
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  postgres_data:
