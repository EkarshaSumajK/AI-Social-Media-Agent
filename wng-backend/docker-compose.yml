services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wng_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wng_password}
      POSTGRES_DB: ${POSTGRES_DB:-wng_content}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info

volumes:
  postgres_data:
