# Alternative Docker Compose for local development with local Redis
# Use this if you want to run with local Redis instead of Upstash
# Usage: docker-compose -f docker-compose.local.yml up

services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - '8000:8000'
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info

volumes:
  redis_data: